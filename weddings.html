<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חתונות | קול תורה</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<header class="site-header">
  <a class="logo-header" href="index.html">ישיבת קול תורה</a>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="חיפוש חתן, אולם, מקום לימודים…">
  </div>
</header>

<main class="page-inner">
  <a class="back-link" href="index.html">→ חזרה ללוח הראשי</a>

  <div class="list-box">
    <div class="toolbar between">
      <div class="view-toggle">
        <button class="toggle-btn active" data-view="table">📋 טבלה</button>
        <button class="toggle-btn" data-view="calendar">🗓 לוח שנה</button>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-outline btn-sm" id="reportBtn">🖊 דיווח למנהל</button>
        <button class="btn btn-primary" id="addBtn">+ הוספת חתונה</button>
      </div>
    </div>

    <!-- תצוגת טבלה -->
    <div id="tableView">
      <div class="weddings-headers">
        <div>שם החתן</div>
        <div>אולם</div>
        <div>תאריך עברי</div>
        <div>יצירת קשר</div>
      </div>
      <div id="rowsContainer">
        <div class="loading-row">טוען נתונים…</div>
      </div>
    </div>

    <!-- תצוגת לוח שנה -->
    <div id="calendarView" style="display:none;">
      <div class="calendar-head">
        <div class="calendar-nav">
          <button class="icon-btn" id="prevMonth">←</button>
          <button class="icon-btn" id="nextMonth">→</button>
        </div>
        <h3 id="calTitle"></h3>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>
</main>

<footer class="site-footer">קול תורה · לוח השמחות</footer>

<!-- מודל הוספת חתונה -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <button class="modal-close" data-close>✕</button>
    <h2 class="modal-title">הוספת חתונה</h2>
    <p class="modal-sub">הפרטים יישלחו לאישור המנהל ויופיעו בלוח לאחר האישור</p>
    <div id="formMsg"></div>
    <form id="addForm">
      <div class="field">
        <label>שם החתן *</label>
        <input type="text" name="groomName" required>
      </div>
      <div class="field-row">
        <div class="field"><label>מקום לימודים *</label><input type="text" name="placeOfStudy" required></div>
        <div class="field"><label>אולם *</label><input type="text" name="hall" required></div>
      </div>
      <div class="field">
        <label>תאריך החתונה (עברי) *</label>
        <div class="hebrew-date-picker">
          <select id="dateDay" required disabled>
            <option value="" disabled selected>יום</option>
          </select>
          <select id="dateMonth" required disabled>
            <option value="" disabled selected>חודש</option>
          </select>
          <select id="dateYear" required>
            <option value="" disabled selected>שנה</option>
          </select>
        </div>
        <div class="field-hint">בחרו שנה ואז חודש — התאריך יומר אוטומטית ללוח האתר</div>
      </div>
      <div class="field">
        <label>טלפון (רשות)</label>
        <input type="tel" name="phone">
      </div>
      <div class="field">
        <label>תמונה (רשות)</label>
        <input type="file" name="photo" accept="image/*">
      </div>
      <button type="submit" class="btn btn-primary btn-block">שליחה לאישור</button>
    </form>
  </div>
</div>

<div class="modal-overlay" id="imgModal">
  <div class="modal-box narrow">
    <button class="modal-close" data-close>✕</button>
    <img id="imgModalSrc" src="" alt="" style="width:100%; border-radius:12px;">
  </div>
</div>

<div class="modal-overlay" id="reportModal">
  <div class="modal-box">
    <button class="modal-close" data-close>✕</button>
    <h2 class="modal-title">דיווח למנהל</h2>
    <p class="modal-sub">טעות בפרטים? בקשה לעדכון? כתבו כאן</p>
    <div id="reportMsg"></div>
    <form id="reportForm">
      <div class="field">
        <label>לגבי מי (רשות)</label>
        <input type="text" name="reference" placeholder="למשל: שם החתן">
      </div>
      <div class="field">
        <label>מה תרצו לדווח? *</label>
        <input type="text" name="message" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">שליחה למנהל</button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/hebrew-calendar.js"></script>
<script>
  let allWeddings = [];
  let calAnchor = new Date();
  const rowsContainer = document.getElementById('rowsContainer');

  async function loadWeddings() {
    try {
      const rows = await Api.list('weddings');
      allWeddings = rows
        .filter(r => r['תאריך החתונה'] && HebrewCal.isTodayOrFuture(new Date(r['תאריך החתונה'])))
        .sort((a, b) => new Date(a['תאריך החתונה']) - new Date(b['תאריך החתונה']));
      renderRows(allWeddings);
      renderCalendar();
    } catch (err) {
      rowsContainer.innerHTML = `<div class="loading-row">שגיאה בטעינה: ${err.message}</div>`;
    }
  }

  function renderRows(rows) {
    if (!rows.length) {
      rowsContainer.innerHTML = `<div class="empty-state">
          <span class="empty-icon">💒</span>
          <div class="empty-text">${allWeddings.length ? 'לא נמצאו תוצאות התואמות לחיפוש' : 'אין חתונות קרובות בלוח כרגע'}</div>
        </div>`;
      return;
    }
    rowsContainer.innerHTML = rows.map(r => {
      const photo = r['תמונה']
        ? `<img class="avatar" src="${r['תמונה']}" data-full="${r['תמונה']}" alt="">`
        : `<div class="avatar-placeholder">🤵</div>`;
      const hebDate = HebrewCal.formatLong(new Date(r['תאריך החתונה']));
      const phone = r['טלפון'] ? `<a class="btn btn-outline btn-sm" href="tel:${r['טלפון']}">📞</a>` : '—';
      return `<div class="weddings-row">
        <div class="person-cell">
          ${photo}
          <div><div class="person-name">${esc(r['שם החתן'])}</div><div class="person-sub">${esc(r['מקום לימודים'])}</div></div>
        </div>
        <div>${esc(r['אולם'])}</div>
        <div>${hebDate}</div>
        <div>${phone}</div>
      </div>`;
    }).join('');

    rowsContainer.querySelectorAll('img.avatar').forEach(img => {
      img.addEventListener('click', () => {
        document.getElementById('imgModalSrc').src = img.dataset.full;
        document.getElementById('imgModal').classList.add('open');
      });
    });
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) return renderRows(allWeddings);
    const filtered = allWeddings.filter(r => {
      const haystack = [r['שם החתן'], r['מקום לימודים'], r['אולם']]
        .map(v => (v || '').toString().toLowerCase()).join(' ');
      return haystack.includes(q);
    });
    renderRows(filtered);
  });

  function renderCalendar() {
    const { start, end } = HebrewCal.monthRange(calAnchor);
    document.getElementById('calTitle').textContent =
      `${HebrewCal.monthName(calAnchor)} ${HebrewCal.yearHeb(calAnchor)}`;

    const dows = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];
    const grid = document.getElementById('calGrid');
    grid.innerHTML = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');

    const leadingBlank = start.getDay(); // 0=ראשון
    for (let i = 0; i < leadingBlank; i++) grid.innerHTML += `<div class="cal-cell empty"></div>`;

    let cursor = new Date(start);
    const today = new Date(); today.setHours(0,0,0,0);
    while (cursor <= end) {
      const isToday = HebrewCal.isSameDay(cursor, today);
      const dayEvents = allWeddings.filter(r => HebrewCal.isSameDay(new Date(r['תאריך החתונה']), cursor));
      const chips = dayEvents.map(r => `<span class="event-chip">${esc(r['שם החתן'])}</span>`).join('');
      grid.innerHTML += `<div class="cal-cell ${isToday ? 'today' : ''}">
          <div class="day-num">${HebrewCal.parts(cursor).day}</div>
          ${chips}
        </div>`;
      cursor = HebrewCal.addDays(cursor, 1);
    }
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    calAnchor = HebrewCal.prevMonthAnchor(calAnchor);
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    calAnchor = HebrewCal.nextMonthAnchor(calAnchor);
    renderCalendar();
  });

  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const isTable = btn.dataset.view === 'table';
      document.getElementById('tableView').style.display = isTable ? '' : 'none';
      document.getElementById('calendarView').style.display = isTable ? 'none' : '';
    });
  });

  function esc(v) {
    if (v === undefined || v === null) return '';
    return String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.modal-overlay').classList.remove('open'));
  });
  document.querySelectorAll('.modal-overlay').forEach(ov => {
    ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(ov => ov.classList.remove('open'));
  });

  document.getElementById('addBtn').addEventListener('click', () => document.getElementById('addModal').classList.add('open'));
  document.getElementById('reportBtn').addEventListener('click', () => document.getElementById('reportModal').classList.add('open'));

  // ---------- בורר תאריך עברי ----------
  const dayEl = document.getElementById('dateDay');
  const monthEl = document.getElementById('dateMonth');
  const yearEl = document.getElementById('dateYear');

  function initHebrewDatePicker() {
    const years = HebrewCal.availableYears().slice(0, 6); // כ-6 שנים קדימה
    yearEl.innerHTML = '<option value="" disabled selected>שנה</option>' +
      years.map(y => `<option value="${y.value}">${y.label}</option>`).join('');
  }

  yearEl.addEventListener('change', () => {
    const year = parseInt(yearEl.value, 10);
    const months = HebrewCal.monthsForYear(year);
    monthEl.innerHTML = '<option value="" disabled selected>חודש</option>' +
      months.map(m => `<option value="${m.value}">${m.label}</option>`).join('');
    monthEl.disabled = false;
    dayEl.innerHTML = '<option value="" disabled selected>יום</option>';
    dayEl.disabled = true;
  });

  monthEl.addEventListener('change', () => {
    const year = parseInt(yearEl.value, 10);
    const month = monthEl.value;
    const count = HebrewCal.daysInMonth(year, month);
    const dayLabels = ['א','ב','ג','ד','ה','ו','ז','ח','ט','י','י"א','י"ב','י"ג','י"ד','ט"ו','ט"ז','י"ז','י"ח','י"ט','כ','כ"א','כ"ב','כ"ג','כ"ד','כ"ה','כ"ו','כ"ז','כ"ח','כ"ט','ל'];
    dayEl.innerHTML = '<option value="" disabled selected>יום</option>' +
      Array.from({ length: count }, (_, i) => `<option value="${i + 1}">${dayLabels[i] || (i + 1)}</option>`).join('');
    dayEl.disabled = false;
  });

  initHebrewDatePicker();

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const msgBox = document.getElementById('formMsg');
    const submitBtn = form.querySelector('button[type=submit]');

    const y = parseInt(yearEl.value, 10), m = monthEl.value, d = parseInt(dayEl.value, 10);
    if (!y || !m || !d) {
      msgBox.innerHTML = `<div class="form-msg error">יש לבחור תאריך חתונה מלא (יום, חודש ושנה)</div>`;
      return;
    }
    const gregDate = HebrewCal.hebrewToGregorian(y, m, d);
    if (!gregDate) {
      msgBox.innerHTML = `<div class="form-msg error">לא ניתן להמיר את התאריך שנבחר, נסו תאריך אחר</div>`;
      return;
    }

    submitBtn.disabled = true; submitBtn.textContent = 'שולח…';
    try {
      const iso = gregDate.getFullYear() + '-' + String(gregDate.getMonth() + 1).padStart(2, '0') + '-' + String(gregDate.getDate()).padStart(2, '0');
      const fields = {
        groomName: form.groomName.value.trim(),
        placeOfStudy: form.placeOfStudy.value.trim(),
        hall: form.hall.value.trim(),
        weddingDate: iso,
        phone: form.phone.value.trim()
      };
      const photoFile = form.photo.files[0];
      const photoBase64 = photoFile ? await compressImageToBase64(photoFile) : null;
      await Api.submit('weddings', fields, photoBase64);
      msgBox.innerHTML = `<div class="form-msg success">החתונה נשלחה לאישור המנהל, מזל טוב!</div>`;
      form.reset();
      monthEl.innerHTML = '<option value="" disabled selected>חודש</option>'; monthEl.disabled = true;
      dayEl.innerHTML = '<option value="" disabled selected>יום</option>'; dayEl.disabled = true;
      setTimeout(() => document.getElementById('addModal').classList.remove('open'), 1400);
    } catch (err) {
      msgBox.innerHTML = `<div class="form-msg error">${err.message}</div>`;
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = 'שליחה לאישור';
    }
  });

  document.getElementById('reportForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const msgBox = document.getElementById('reportMsg');
    const submitBtn = form.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = 'שולח…';
    try {
      await Api._post({ action: 'report', reportType: 'weddings', reference: form.reference.value.trim(), message: form.message.value.trim() });
      msgBox.innerHTML = `<div class="form-msg success">הדיווח נשלח למנהל, תודה!</div>`;
      form.reset();
      setTimeout(() => document.getElementById('reportModal').classList.remove('open'), 1400);
    } catch (err) {
      msgBox.innerHTML = `<div class="form-msg error">אירעה שגיאה, נסו שוב</div>`;
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = 'שליחה למנהל';
    }
  });

  loadWeddings();
</script>
</body>
</html>
