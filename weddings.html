<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חתונות | קול תורה</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <a class="brand" href="index.html">ישיבת קול תורה</a>
</nav>

<header class="site-header">
    <h1>חתונות</h1>
  <p>טבלה ולוח שנה עברי לחתונות הקרובות</p>
</header>

<main class="page">
  <a class="nav-back" href="index.html">→ חזרה ללוח הראשי</a>

  <div class="card-panel">
    <div class="toolbar">
      <div class="tabs">
        <button class="tab-btn active" data-view="table">📋 טבלה</button>
        <button class="tab-btn" data-view="calendar">🗓 לוח שנה</button>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-ghost btn-sm" id="reportBtn">🖊 דיווח למנהל</button>
        <button class="btn btn-primary" id="addBtn">+ הוספת חתונה</button>
      </div>
    </div>

    <!-- תצוגת טבלה -->
    <div id="tableView">
      <div class="table-wrap">
        <table class="data-table" id="dataTable">
          <thead>
            <tr>
              <th></th>
              <th>שם החתן</th>
              <th>מקום לימודים</th>
              <th>אולם</th>
              <th>עיר האולם</th>
              <th>תאריך עברי</th>
              <th>יצירת קשר</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="7" class="loading-row">טוען נתונים…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- תצוגת לוח שנה -->
    <div id="calendarView" style="display:none;">
      <div class="calendar-head">
        <div class="calendar-nav">
          <button class="icon-btn" id="prevMonth">←</button>
          <button class="icon-btn" id="nextMonth">→</button>
        </div>
        <h3 id="calTitle"></h3>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>
</main>

<footer class="site-footer">קול תורה · לוח השמחות</footer>

<!-- מודל הוספת חתונה -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <button class="modal-close" data-close>✕</button>
    <h2>הוספת חתונה</h2>
    <p class="sub">הפרטים יישלחו לאישור המנהל ויופיעו בלוח לאחר האישור</p>
    <div id="formMsg"></div>
    <form id="addForm">
      <div class="field">
        <label>שם החתן *</label>
        <input type="text" name="groomName" required>
      </div>
      <div class="field">
        <label>מקום לימודים (רשות)</label>
        <input type="text" name="placeOfStudy">
      </div>
      <div class="field-row">
        <div class="field"><label>אולם *</label><input type="text" name="hall" required></div>
        <div class="field"><label>עיר האולם (רשות)</label><input type="text" name="hallCity"></div>
      </div>
      <div class="field">
        <label>תאריך החתונה (עברי) *</label>
        <div class="field-row-3">
          <select id="weddingDay" required></select>
          <select id="weddingMonth" required></select>
          <select id="weddingYear" required></select>
        </div>
      </div>
      <div class="field">
        <label>טלפון (רשות)</label>
        <input type="tel" name="phone">
      </div>
      <div class="field">
        <label>תמונה (רשות)</label>
        <input type="file" name="photo" accept="image/*">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">שליחה לאישור</button>
    </form>
  </div>
</div>

<div class="modal-overlay" id="imgModal">
  <div class="modal-box" style="max-width:420px; text-align:center;">
    <button class="modal-close" data-close>✕</button>
    <img id="imgModalSrc" src="" alt="" style="width:100%; border-radius:12px;">
  </div>
</div>

<div class="modal-overlay" id="reportModal">
  <div class="modal-box">
    <button class="modal-close" data-close>✕</button>
    <h2>דיווח למנהל</h2>
    <p class="sub">טעות בפרטים? בקשה לעדכון? כתבו כאן</p>
    <div id="reportMsg"></div>
    <form id="reportForm">
      <div class="field">
        <label>לגבי מי (רשות)</label>
        <input type="text" name="reference" placeholder="למשל: שם החתן">
      </div>
      <div class="field">
        <label>מה תרצו לדווח? *</label>
        <input type="text" name="message" required>
      </div>
      <button type="submit" class="btn btn-secondary" style="width:100%; justify-content:center;">שליחה למנהל</button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/hebrew-calendar.js"></script>
<script>
  let allWeddings = [];
  let calAnchor = new Date();
  const tableBody = document.getElementById('tableBody');

  async function loadWeddings() {
    try {
      const rows = await Api.list('weddings');
      allWeddings = rows
        .filter(r => r['תאריך החתונה'] && HebrewCal.isTodayOrFuture(new Date(r['תאריך החתונה'])))
        .sort((a, b) => new Date(a['תאריך החתונה']) - new Date(b['תאריך החתונה']));
      renderTable(allWeddings);
      renderCalendar();
    } catch (err) {
      tableBody.innerHTML = `<tr><td colspan="7" class="loading-row">שגיאה בטעינה: ${err.message}</td></tr>`;
    }
  }

  function renderTable(rows) {
    if (!rows.length) {
      tableBody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><span class="big">💒</span>אין חתונות קרובות בלוח כרגע</div></td></tr>`;
      return;
    }
    tableBody.innerHTML = rows.map(r => {
      const photo = r['תמונה']
        ? `<img class="avatar" src="${r['תמונה']}" data-full="${r['תמונה']}" alt="">`
        : `<div class="avatar-placeholder">🤵</div>`;
      const hebDate = HebrewCal.formatLong(new Date(r['תאריך החתונה']));
      const phone = r['טלפון'] ? `<a class="btn btn-secondary btn-sm" href="tel:${r['טלפון']}">📞</a>` : '—';
      return `<tr>
        <td>${photo}</td>
        <td><strong>${esc(r['שם החתן'])}</strong></td>
        <td>${esc(r['מקום לימודים'])}</td>
        <td>${esc(r['אולם'])}</td>
        <td>${esc(r['עיר האולם'])}</td>
        <td>${hebDate}</td>
        <td>${phone}</td>
      </tr>`;
    }).join('');

    tableBody.querySelectorAll('img.avatar').forEach(img => {
      img.addEventListener('click', () => {
        document.getElementById('imgModalSrc').src = img.dataset.full;
        document.getElementById('imgModal').classList.add('open');
      });
    });
  }

  function renderCalendar() {
    const { start, end } = HebrewCal.monthRange(calAnchor);
    document.getElementById('calTitle').textContent =
      `${HebrewCal.monthName(calAnchor)} ${HebrewCal.yearHeb(calAnchor)}`;

    const dows = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];
    const grid = document.getElementById('calGrid');
    grid.innerHTML = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');

    const leadingBlank = start.getDay(); // 0=ראשון
    for (let i = 0; i < leadingBlank; i++) grid.innerHTML += `<div class="cal-cell empty"></div>`;

    let cursor = new Date(start);
    const today = new Date(); today.setHours(0,0,0,0);
    while (cursor <= end) {
      const isToday = HebrewCal.isSameDay(cursor, today);
      const dayEvents = allWeddings.filter(r => HebrewCal.isSameDay(new Date(r['תאריך החתונה']), cursor));
      const chips = dayEvents.map(r => `<span class="event-chip">${esc(r['שם החתן'])}</span>`).join('');
      grid.innerHTML += `<div class="cal-cell ${isToday ? 'today' : ''}">
          <div class="day-num">${HebrewCal.parts(cursor).day}</div>
          ${chips}
        </div>`;
      cursor = HebrewCal.addDays(cursor, 1);
    }
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    calAnchor = HebrewCal.prevMonthAnchor(calAnchor);
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    calAnchor = HebrewCal.nextMonthAnchor(calAnchor);
    renderCalendar();
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const isTable = btn.dataset.view === 'table';
      document.getElementById('tableView').style.display = isTable ? '' : 'none';
      document.getElementById('calendarView').style.display = isTable ? 'none' : '';
    });
  });

  function esc(v) {
    if (v === undefined || v === null) return '';
    return String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.modal-overlay').classList.remove('open'));
  });
  document.querySelectorAll('.modal-overlay').forEach(ov => {
    ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });
  });

  document.getElementById('addBtn').addEventListener('click', () => document.getElementById('addModal').classList.add('open'));
  document.getElementById('reportBtn').addEventListener('click', () => document.getElementById('reportModal').classList.add('open'));

  // בורר תאריך החתונה (עברי) - ברירת המחדל היא היום העברי הנוכחי
  const weddingDatePicker = HebrewCal.setupDatePicker(
    document.getElementById('weddingDay'),
    document.getElementById('weddingMonth'),
    document.getElementById('weddingYear')
  );

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const msgBox = document.getElementById('formMsg');
    const submitBtn = form.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = 'שולח…';
    try {
      const weddingDateISO = weddingDatePicker.getISO();
      if (!weddingDateISO) {
        msgBox.innerHTML = `<div class="form-msg error">התאריך שנבחר אינו תקין, אנא בדקו את הבחירה</div>`;
        submitBtn.disabled = false; submitBtn.textContent = 'שליחה לאישור';
        return;
      }
      const fields = {
        groomName: form.groomName.value.trim(),
        placeOfStudy: form.placeOfStudy.value.trim(),
        hall: form.hall.value.trim(),
        hallCity: form.hallCity.value.trim(),
        weddingDate: weddingDateISO,
        phone: form.phone.value.trim()
      };
      const photoFile = form.photo.files[0];
      const photoBase64 = photoFile ? await compressImageToBase64(photoFile) : null;
      await Api.submit('weddings', fields, photoBase64);
      msgBox.innerHTML = `<div class="form-msg success">החתונה נשלחה לאישור המנהל, מזל טוב!</div>`;
      form.reset();
      HebrewCal.setupDatePicker(
        document.getElementById('weddingDay'),
        document.getElementById('weddingMonth'),
        document.getElementById('weddingYear')
      );
      setTimeout(() => document.getElementById('addModal').classList.remove('open'), 1400);
    } catch (err) {
      msgBox.innerHTML = `<div class="form-msg error">${err.message}</div>`;
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = 'שליחה לאישור';
    }
  });

  document.getElementById('reportForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const msgBox = document.getElementById('reportMsg');
    const submitBtn = form.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = 'שולח…';
    try {
      await Api._post({ action: 'report', reportType: 'weddings', reference: form.reference.value.trim(), message: form.message.value.trim() });
      msgBox.innerHTML = `<div class="form-msg success">הדיווח נשלח למנהל, תודה!</div>`;
      form.reset();
      setTimeout(() => document.getElementById('reportModal').classList.remove('open'), 1400);
    } catch (err) {
      msgBox.innerHTML = `<div class="form-msg error">אירעה שגיאה, נסו שוב</div>`;
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = 'שליחה למנהל';
    }
  });

  loadWeddings();
</script>
</body>
</html>
