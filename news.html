<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בשורות טובות | לוח השמחות</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <a class="brand" href="index.html">לוח השמחות</a>
</nav>

<header class="site-header">
  <h1>בשורות טובות</h1>
  <p>החתנים והחתונות האחרונים, בס"ד</p>
</header>

<main class="page">
  <a class="nav-back" href="index.html">→ חזרה ללוח הראשי</a>

  <div class="card-panel">
    <div class="toolbar">
      <div id="countLabel" style="color: var(--muted); font-weight: 700;"></div>
      <button class="btn btn-ghost btn-sm" id="refreshBtn">↻ רענון</button>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>החתן</th>
            <th>הכלה</th>
            <th>תאריכים</th>
            <th>יצירת קשר</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="4" class="loading-row">טוען נתונים…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<footer class="site-footer">לוח השמחות</footer>

<script src="js/news-api.js"></script>
<script>
const tableBody = document.getElementById('tableBody');
const countLabel = document.getElementById('countLabel');

function esc(v) {
  if (v === undefined || v === null) return '';
  return String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// תאריך לועזי + עברי, בצורה בטוחה
function fmtDate(v) {
  if (!v) return '';
  const d = new Date(v);
  if (isNaN(d)) return esc(v);
  let greg = '', heb = '';
  try { greg = d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: 'numeric' }); } catch (e) {}
  try { heb = d.toLocaleDateString('he-IL-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) {}
  return esc(heb || greg) + (heb && greg ? `<br><span style="color:var(--muted); font-size:13px;">${esc(greg)}</span>` : '');
}

function sub(a, b) {
  const parts = [a, b].filter(Boolean).map(esc);
  return parts.length ? `<br><span style="color:var(--muted); font-size:13px;">${parts.join(' · ')}</span>` : '';
}

function render(items) {
  countLabel.textContent = items.length ? `${items.length} בשורות` : '';
  if (!items.length) {
    tableBody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><span class="big">💍</span>אין נתונים להצגה</div></td></tr>`;
    return;
  }
  tableBody.innerHTML = items.map(r => {
    const dates = [];
    if (r.engagement_date) dates.push('<strong>אירוסין:</strong> ' + fmtDate(r.engagement_date));
    if (r.date) dates.push('<strong>חתונה:</strong> ' + fmtDate(r.date) + (r.place ? '<br><span style="color:var(--muted); font-size:13px;">' + esc(r.place) + '</span>' : ''));
    const phone = r.groom_phone ? `<a class="btn btn-secondary btn-sm" href="tel:${esc(r.groom_phone)}">📞 יצירת קשר</a>` : '—';
    return `<tr>
      <td><strong>${esc(r.name)}</strong>${sub(r.groom_city, r.groom_school)}</td>
      <td><strong>${esc(r.bride_name)}</strong>${sub(r.bride_city, r.bride_school)}</td>
      <td>${dates.join('<br>') || '—'}</td>
      <td>${phone}</td>
    </tr>`;
  }).join('');
}

async function load(force) {
  tableBody.innerHTML = `<tr><td colspan="4" class="loading-row">טוען נתונים…</td></tr>`;
  try {
    const data = await NewsApi.load(force);
    render(data.items || []);
  } catch (err) {
    console.error(err);
    tableBody.innerHTML = `<tr><td colspan="4" class="loading-row">שגיאה בטעינה: ${esc(err.message)}</td></tr>`;
  }
}

document.getElementById('refreshBtn').addEventListener('click', () => load(true));
load(false);
</script>
</body>
</html>
