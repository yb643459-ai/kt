<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מאורסים | קול תורה</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<header class="site-header">
  <a class="logo-header" href="index.html">ישיבת קול תורה</a>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="חיפוש חתן, כלה, עיר…">
  </div>
</header>

<main class="page-inner">
  <a class="back-link" href="index.html">→ חזרה ללוח הראשי</a>

  <div class="list-box">
    <div class="toolbar between">
      <div class="count-label" id="countLabel"></div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-outline btn-sm" id="reportBtn">🖊 דיווח למנהל</button>
        <button class="btn btn-primary" id="addBtn">+ הוספת שידוך חדש</button>
      </div>
    </div>

    <div class="engaged-headers">
      <div>החתן</div>
      <div>הכלה</div>
      <div>יצירת קשר</div>
    </div>

    <div id="rowsContainer">
      <div class="loading-row">טוען נתונים…</div>
    </div>
  </div>
</main>

<footer class="site-footer">קול תורה · לוח השמחות</footer>

<!-- מודל הוספת שידוך -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <button class="modal-close" data-close>✕</button>
    <h2 class="modal-title">הוספת שידוך חדש</h2>
    <p class="modal-sub">הפרטים יישלחו לאישור המנהל ויופיעו בלוח לאחר האישור</p>
    <div id="formMsg"></div>
    <form id="addForm">
      <div class="form-section">
        <h3>פרטי החתן</h3>
        <div class="field">
          <label>שם החתן *</label>
          <input type="text" name="groomName" required>
        </div>
        <div class="field-row">
          <div class="field"><label>עיר *</label><input type="text" name="groomCity" required></div>
          <div class="field"><label>ישיבה *</label><input type="text" name="groomYeshiva" required></div>
        </div>
      </div>

      <div class="form-section">
        <h3>פרטי הכלה</h3>
        <div class="field">
          <label>שם הכלה *</label>
          <input type="text" name="brideName" required>
        </div>
        <div class="field-row">
          <div class="field"><label>עיר *</label><input type="text" name="brideCity" required></div>
          <div class="field"><label>סמינר *</label><input type="text" name="brideSeminar" required></div>
        </div>
      </div>

      <div class="field">
        <label>טלפון ליצירת קשר (רשות)</label>
        <input type="tel" name="phone" placeholder="לשליחת ברכות">
      </div>
      <div class="field">
        <label>תמונה (רשות)</label>
        <input type="file" name="photo" accept="image/*">
      </div>
      <button type="submit" class="btn btn-primary btn-block">שליחה לאישור</button>
    </form>
  </div>
</div>

<!-- מודל הגדלת תמונה -->
<div class="modal-overlay" id="imgModal">
  <div class="modal-box narrow">
    <button class="modal-close" data-close>✕</button>
    <img id="imgModalSrc" src="" alt="" style="width:100%; border-radius:12px;">
  </div>
</div>

<!-- מודל דיווח למנהל -->
<div class="modal-overlay" id="reportModal">
  <div class="modal-box">
    <button class="modal-close" data-close>✕</button>
    <h2 class="modal-title">דיווח למנהל</h2>
    <p class="modal-sub">טעות בפרטים? בקשה לעדכון? כתבו כאן</p>
    <div id="reportMsg"></div>
    <form id="reportForm">
      <div class="field">
        <label>לגבי מי (רשות)</label>
        <input type="text" name="reference" placeholder="למשל: שם החתן">
      </div>
      <div class="field">
        <label>מה תרצו לדווח? *</label>
        <input type="text" name="message" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">שליחה למנהל</button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  const rowsContainer = document.getElementById('rowsContainer');
  const countLabel = document.getElementById('countLabel');
  let allRows = [];

  async function loadEngaged() {
    try {
      allRows = await Api.list('engaged');
      renderRows(allRows);
    } catch (err) {
      rowsContainer.innerHTML = `<div class="loading-row">שגיאה בטעינה: ${err.message}</div>`;
    }
  }

  function renderRows(rows) {
    countLabel.textContent = allRows.length ? `${allRows.length} שידוכים` : '';
    if (!rows.length) {
      rowsContainer.innerHTML = `<div class="empty-state">
          <span class="empty-icon">💍</span>
          <div class="empty-text">${allRows.length ? 'לא נמצאו תוצאות התואמות לחיפוש' : 'עדיין אין שידוכים מאושרים בלוח'}</div>
        </div>`;
      return;
    }
    rowsContainer.innerHTML = rows.map(r => {
      const photo = r['תמונה']
        ? `<img class="avatar" src="${r['תמונה']}" data-full="${r['תמונה']}" alt="">`
        : `<div class="avatar-placeholder">💍</div>`;
      const phone = r['טלפון'] ? `<a class="btn btn-outline btn-sm" href="tel:${r['טלפון']}">📞 יצירת קשר</a>` : '—';
      return `<div class="engaged-row">
        <div class="person-cell">
          ${photo}
          <div><div class="person-name">${esc(r['שם החתן'])}</div><div class="person-sub">${esc(r['עיר החתן'])} · ${esc(r['ישיבת החתן'])}</div></div>
        </div>
        <div class="person-cell">
          <div><div class="person-name">${esc(r['שם הכלה'])}</div><div class="person-sub">${esc(r['עיר הכלה'])} · ${esc(r['סמינר הכלה'])}</div></div>
        </div>
        <div>${phone}</div>
      </div>`;
    }).join('');

    rowsContainer.querySelectorAll('img.avatar').forEach(img => {
      img.addEventListener('click', () => {
        document.getElementById('imgModalSrc').src = img.dataset.full;
        document.getElementById('imgModal').classList.add('open');
      });
    });
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) return renderRows(allRows);
    const filtered = allRows.filter(r => {
      const haystack = [r['שם החתן'], r['עיר החתן'], r['ישיבת החתן'], r['שם הכלה'], r['עיר הכלה'], r['סמינר הכלה']]
        .map(v => (v || '').toString().toLowerCase()).join(' ');
      return haystack.includes(q);
    });
    renderRows(filtered);
  });

  function esc(v) {
    if (v === undefined || v === null) return '';
    return String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  // מודלים כלליים
  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.modal-overlay').classList.remove('open'));
  });
  document.querySelectorAll('.modal-overlay').forEach(ov => {
    ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(ov => ov.classList.remove('open'));
  });

  document.getElementById('addBtn').addEventListener('click', () => document.getElementById('addModal').classList.add('open'));
  document.getElementById('reportBtn').addEventListener('click', () => document.getElementById('reportModal').classList.add('open'));

  // טופס הוספה
  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const msgBox = document.getElementById('formMsg');
    const submitBtn = form.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = 'שולח…';
    try {
      const fields = {
        groomName: form.groomName.value.trim(),
        groomCity: form.groomCity.value.trim(),
        groomYeshiva: form.groomYeshiva.value.trim(),
        brideName: form.brideName.value.trim(),
        brideCity: form.brideCity.value.trim(),
        brideSeminar: form.brideSeminar.value.trim(),
        phone: form.phone.value.trim()
      };
      const photoFile = form.photo.files[0];
      const photoBase64 = photoFile ? await compressImageToBase64(photoFile) : null;
      await Api.submit('engaged', fields, photoBase64);
      msgBox.innerHTML = `<div class="form-msg success">השידוך נשלח לאישור המנהל, תודה!</div>`;
      form.reset();
      setTimeout(() => document.getElementById('addModal').classList.remove('open'), 1400);
    } catch (err) {
      msgBox.innerHTML = `<div class="form-msg error">${err.message}</div>`;
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = 'שליחה לאישור';
    }
  });

  // טופס דיווח
  document.getElementById('reportForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const msgBox = document.getElementById('reportMsg');
    const submitBtn = form.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = 'שולח…';
    try {
      await Api._post({ action: 'report', reportType: 'engaged', reference: form.reference.value.trim(), message: form.message.value.trim() });
      msgBox.innerHTML = `<div class="form-msg success">הדיווח נשלח למנהל, תודה!</div>`;
      form.reset();
      setTimeout(() => document.getElementById('reportModal').classList.remove('open'), 1400);
    } catch (err) {
      msgBox.innerHTML = `<div class="form-msg error">אירעה שגיאה, נסו שוב</div>`;
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = 'שליחה למנהל';
    }
  });

  loadEngaged();
</script>
</body>
</html>
